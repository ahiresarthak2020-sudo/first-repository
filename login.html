<!DOCTYPE html>
<html>

<head>

<title>Login Page</title>

<style>

body{
    background-color:lightblue;
    font-family:Arial;
}

.login{
    width:300px;
    margin:100px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
}

input{
    width:90%;
    padding:10px;
    margin:10px;
}

button{
    width:95%;
    padding:10px;
    background-color:green;
    color:white;
    border:none;
    font-size:18px;
}

</style>

</head>

<body>

<div class="login">

<h2>Login</h2>

<form action="home.html">

<input type="text" placeholder="Username" required>

<input type="password" placeholder="Password" required>

<a href="home.html">
<button>Login</button>
</form>
</a>

</div>

</body>

</html>
