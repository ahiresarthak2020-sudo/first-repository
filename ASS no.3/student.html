<!DOCTYPE html>
<html>

<head>

    <title>Student Marks Calculator</title>

    <style>

        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }

        .box {
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
        }

        input {
            width: 200px;
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>Student Marks Calculator</h1>

        <input type="number" id="sub1" placeholder="Subject 1">
        <br>

        <input type="number" id="sub2" placeholder="Subject 2">
        <br>

        <input type="number" id="sub3" placeholder="Subject 3">
        <br>

        <input type="number" id="sub4" placeholder="Subject 4">
        <br>

        <input type="number" id="sub5" placeholder="Subject 5">
        <br><br>

        <button onclick="calculate()">Calculate</button>

        <div id="result"></div>

    </div>


    <script>

        function calculate() {

            let m1 = Number(document.getElementById("sub1").value);
            let m2 = Number(document.getElementById("sub2").value);
            let m3 = Number(document.getElementById("sub3").value);
            let m4 = Number(document.getElementById("sub4").value);
            let m5 = Number(document.getElementById("sub5").value);

            let total = m1 + m2 + m3 + m4 + m5;

            let percentage = total / 5;

            let grade;

            if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            if (percentage >= 40) {

                document.getElementById("result").innerHTML =
                    "Total Marks = " + total +
                    "<br>Percentage = " + percentage + "%" +
                    "<br>Grade = " + grade +
                    "<br>Result = PASS";

            }
            else {

                document.getElementById("result").innerHTML =
                    "Total Marks = " + total +
                    "<br>Percentage = " + percentage + "%" +
                    "<br>Grade = F" +
                    "<br>Result = FAIL";

            }

        }

    </script>

</body>

</html>
