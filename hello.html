<!DOCTYPE html>
<html>
<head>
    <title>Cricket Registration Form</title>
</head>
<body>

<h2>Cricket Registration Form</h2>

<form>

<label>Full Name:</label><br>
<input type="text" placeholder="Enter your full name"><br><br>

<label>Age:</label><br>
<input type="number" placeholder="Enter your age"><br><br>

<label>Email:</label><br>
<input type="email" placeholder="Enter your email"><br><br>

<label>Mobile Number:</label><br>
<input type="tel" placeholder="Enter your mobile number"><br><br>

<label>Gender:</label><br>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<br><br>

<label>Select Your Role:</label><br>
<select>
    <option>Batsman</option>
    <option>Bowler</option>
    <option>All-Rounder</option>
    <option>Wicket Keeper</option>
</select>
<br><br>

<label>Experience:</label><br>
<input type="checkbox"> School Level
<input type="checkbox"> College Level
<input type="checkbox"> District Level
<br><br>

<label>Address:</label><br>
<textarea rows="4" cols="30"></textarea>
<br><br>

<input type="submit" value="Register">
<input type="reset" value="Clear">

</form>

</body>
</html>
